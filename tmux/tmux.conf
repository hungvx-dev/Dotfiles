# ───────────── Plugins ─────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# ───────────── Terminal & colors ─────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB:usstyle:hyperlinks:clipboard:extkeys"
set -g extended-keys on
set -g extended-keys-format csi-u
set -g focus-events on
set -g allow-passthrough on
set -ga update-environment TERM_PROGRAM

# ───────────── General ─────────────
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g set-titles on
set -g set-titles-string "#S:#W"
set -g mode-keys vi
set -g set-clipboard on

# ───────────── Appearance ─────────────
set -g status off
set -g message-style "bg=default,fg=white"
set -g message-command-style "bg=default,fg=#00ffff"
set -g pane-active-border-style "fg=#FF0F80"
set -g pane-border-style "fg=#3b3b3b"
set -g pane-border-indicators both

# ───────────── Prefix ─────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ───────────── Copy mode ─────────────
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi H send-keys -X start-of-line
bind -T copy-mode-vi L send-keys -X end-of-line

# ───────────── Panes ─────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r C-k resize-pane -U 2
bind -r C-j resize-pane -D 2
bind -r C-h resize-pane -L 2
bind -r C-l resize-pane -R 2
bind f resize-pane -Z

# ───────────── Splits & windows (keep cwd) ─────────────
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window -c "#{pane_current_path}"
bind C-c new-session

# ───────────── Reload ─────────────
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# ───────────── Load plugins (keep this last) ─────────────
run '~/.config/tmux/plugins/tpm/tpm'

# ───────────── Overrides that must win over tmux-sensible ─────────────
set -g status-keys vi
set -sg escape-time 0
