"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
follow_symlinks = true
command_timeout = 500
palette = "eryx"

format = """
$directory\
$git_branch$git_commit$git_state$git_metrics$git_status\
$package\
$c$golang$rust$nodejs$bun$lua$java$swift\
$fill\
$docker_context\
$aws$gcloud$kubernetes\
$time$cmd_duration
$username$nix_shell$character"""


[palettes.eryx]
red = "#ff0c36"
yellow = "#FFEA00"
green = "#76FF03"
pink = "#FF0F80"
orange = "#FF6D00"
purple = "#d150ff"
cyan = "#00FFFF"
blue = "#0089fc"

[directory]
truncation_length = 5
truncation_symbol = '…/'
truncate_to_repo = false
read_only = " 󰌾"
style = "italic blue"
format = '[󰝰 ](cyan)[$path]($style)[$read_only]($read_only_style) '
[directory.substitutions]
"Documents" = " "
"Downloads" = "󰉍 Downloads"
"Music" = "󱍙 Music"
"Pictures" = "󰉔 Pictures"

[git_branch]
style = "bold orange"
[git_commit]
tag_disabled = false
[git_metrics]
disabled = false
added_style = "cyan"
deleted_style = "red"
format = '([󰜄 $added]($added_style) )([󰛲 $deleted]($deleted_style) )'

[package]
symbol = "󰏗 "

[c]
symbol = "󰙱 "
[golang]
symbol = "󰟓 "
[rust]
symbol = "󱘗 "
[java]
symbol = "󰬷 "
[nodejs]
symbol = "󰎙 "
[bun]
symbol = " "
[lua]
symbol = "󰢱 "
[swift]
symbol = " "

[docker_context]
symbol = "󰡨 "
format = '[$symbol$context]($style) '

[aws]
symbol = '󰸏 '
[kubernetes]
symbol = "󱃾 "
[gcloud]
symbol = "󱇶 "

[fill]
symbol = " "

[cmd_duration]
format = '[⏱ $duration]($style)'
style = "italic white"
[username]
style_user = "cyan bold italic"
style_root = "red bold italic"
format = "[󰀄 $user]($style) " # 󰯊 󱃲 󰨑 #

[time]
disabled = false
time_format = "%R"
format = "[󱫭 $time]($style)"
utc_time_offset = "local"
style = "italic dimmed white"

[nix_shell]
disabled = false
heuristic = true
style = "bold blue"
format = '[󱄅 ]($style)'
pure_msg = '[pure](bold green)'
impure_msg = ''
unknown_msg = ''

[character]
success_symbol = '[❯](green)'
error_symbol = '[✗](red)'
vicmd_symbol = "[󰺕](cyan)"
vimcmd_visual_symbol = "[❮](pink)"
